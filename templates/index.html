<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サーバー監視ダッシュボード</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        :root {
            --bs-body-bg: #0d1117;
            --bs-body-color: #e6edf3;
            --card-bg: #161b22;
            --card-border: #30363d;
            --primary-color: #238636;
            --warning-color: #f85149;
            --info-color: #58a6ff;
            --gpu-color: #8b5cf6;
            --gpu-gradient-start: #6366f1;
            --gpu-gradient-end: #a855f7;
        }

        body {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            padding: 15px;
            font-size: 14px;
        }

        .container-fluid {
            max-width: none;
            padding: 0 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            background-color: #21262d;
            border-bottom: 1px solid var(--card-border);
            font-weight: bold;
            padding: 10px 15px;
        }

        .card-body {
            padding: 15px;
        }

        /* 横長レイアウト用のグリッド */
        .wide-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .extra-wide-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        /* CPU温度専用の横長デザイン */
        .temperature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .temp-item {
            background: linear-gradient(145deg, #1c2128, #161b22);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .temp-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* GPU専用のスタイル */
        .temp-item.gpu-temp {
            background: linear-gradient(145deg, #2e1f5e, #1e1433);
            border: 1px solid #4c3a8f;
            position: relative;
            overflow: hidden;
        }

        .temp-item.gpu-temp::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(90deg, var(--gpu-gradient-start), var(--gpu-gradient-end));
            border-radius: 8px;
            opacity: 0.3;
            z-index: -1;
            animation: gpuGlow 3s ease-in-out infinite;
        }

        @keyframes gpuGlow {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }

        .temp-item.gpu-temp .temp-label {
            color: #c4b5fd;
            font-weight: bold;
        }

        .temp-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .temp-label {
            font-size: 0.9rem;
            color: #7d8590;
            margin-bottom: 8px;
        }

        .temp-bar {
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .temp-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* GPU温度バー専用 */
        .gpu-temp .temp-bar {
            background: #1a0f2e;
        }

        .gpu-temp .temp-fill {
            background: linear-gradient(90deg, var(--gpu-gradient-start), var(--gpu-gradient-end));
        }

        /* GPU情報カード拡張 */
        .gpu-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .gpu-stat-item {
            background: linear-gradient(145deg, #1c2128, #161b22);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }

        .gpu-stat-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--gpu-color);
        }

        .gpu-stat-label {
            font-size: 0.8rem;
            color: #7d8590;
            margin-top: 5px;
        }

        /* プログレスバーのダークテーマ調整 */
        .progress {
            background-color: #21262d;
            height: 25px;
            margin-bottom: 10px;
        }

        .progress-bar {
            font-weight: bold;
            color: #000;
        }

        .bg-success {
            background-color: var(--primary-color) !important;
        }

        .bg-warning {
            background-color: #d29922 !important;
        }

        .bg-danger {
            background-color: var(--warning-color) !important;
        }

        .bg-info {
            background-color: var(--info-color) !important;
        }

        .bg-gpu {
            background: linear-gradient(90deg, var(--gpu-gradient-start), var(--gpu-gradient-end)) !important;
        }

        /* テーブルのダークテーマ */
        .table-dark {
            --bs-table-bg: var(--card-bg);
            --bs-table-striped-bg: #1c2128;
            border-color: var(--card-border);
        }

        .table-responsive {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--card-border);
            border-radius: 6px;
        }

        /* ボタンとコントロール */
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background-color: #2ea043;
            border-color: #2ea043;
        }

        /* チャートのダークテーマ調整 */
        canvas {
            background: linear-gradient(145deg, #1c2128, #161b22);
            border-radius: 6px;
        }

        #last-update {
            font-style: italic;
            text-align: right;
            font-size: 12px;
            color: #7d8590;
        }

        /* システム情報のコンパクト表示 */
        .system-info-compact {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            font-size: 13px;
        }

        .system-info-item {
            background: #1c2128;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        /* GPUなしメッセージ */
        .no-gpu-message {
            text-align: center;
            padding: 20px;
            color: #7d8590;
            font-style: italic;
        }

        /* レスポンシブ対応 */
        @media (min-width: 1920px) {
            .ultra-wide-grid {
                grid-template-columns: repeat(6, 1fr);
            }

            .temperature-grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }

        @media (min-width: 2560px) {
            .ultra-wide-grid {
                grid-template-columns: repeat(8, 1fr);
            }

            .temperature-grid {
                grid-template-columns: repeat(10, 1fr);
            }
        }

        /* スクロールバーのダークテーマ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #161b22;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* アラート用スタイル */
        .alert-banner {
            margin-bottom: 15px;
            padding: 12px 20px;
            border-radius: 6px;
            border-left: 4px solid;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-danger {
            background-color: #2d1519;
            border-left-color: var(--warning-color);
            color: #ffc9c9;
        }

        .alert-warning {
            background-color: #2d2410;
            border-left-color: #d29922;
            color: #ffd89d;
        }

        /* ボタンスタイル */
        .btn-danger {
            background-color: var(--warning-color);
            border-color: var(--warning-color);
        }

        .btn-danger:hover {
            background-color: #b83e35;
            border-color: #b83e35;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }

        /* 消費電力用スタイル */
        .power-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .power-item {
            background: linear-gradient(145deg, #1c2128, #161b22);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .power-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f0c808;
            margin: 10px 0;
        }

        .power-label {
            font-size: 0.9rem;
            color: #7d8590;
            margin-bottom: 8px;
        }

        .power-bar {
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .power-fill {
            height: 100%;
            background: linear-gradient(90deg, #f0c808, #ff8c00);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1 class="text-center mb-4">サーバー監視ダッシュボード</h1>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <button id="refresh-btn" class="btn btn-primary"><i class="fas fa-sync-alt"></i> 更新</button>
            <div id="last-update">最終更新: -</div>
        </div>

        <!-- システム情報 - コンパクト表示 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-server"></i> システム情報
            </div>
            <div class="card-body">
                <div class="system-info-compact" id="system-info">
                    <!-- ここにシステム情報が動的に追加されます -->
                </div>
            </div>
        </div>

        <!-- CPU & メモリ - 横長レイアウト -->
        <div class="wide-grid">
            <!-- CPU情報 -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-microchip"></i> CPU使用率
                </div>
                <div class="card-body">
                    <div id="cpu-model" class="mb-2"></div>
                    <div class="progress mb-3">
                        <div id="cpu-usage" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div id="cpu-info"></div>
                        </div>
                        <div class="col-md-6">
                            <canvas id="cpu-chart" height="160"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- メモリ情報 -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-memory"></i> メモリ使用率
                </div>
                <div class="card-body">
                    <div class="progress mb-3">
                        <div id="memory-usage" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                    </div>
                    <div id="memory-info"></div>
                    <div class="mt-3">
                        <h6>スワップ</h6>
                        <div class="progress">
                            <div id="swap-usage" class="progress-bar bg-info" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                        </div>
                        <div id="swap-info"></div>
                    </div>
                </div>
            </div>

            <!-- GPU情報 -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-tv"></i> GPU情報
                </div>
                <div class="card-body" id="gpu-info">
                    <!-- ここにGPU情報が動的に追加されます -->
                </div>
            </div>
        </div>

        <!-- システムアラート -->
        <div id="alerts-container">
            <!-- ここにアラートが動的に追加されます -->
        </div>

        <!-- 温度情報 - 横長専用デザイン -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-thermometer-half"></i> 温度情報
            </div>
            <div class="card-body">
                <div id="temperature-info">
                    <!-- ここに温度情報が動的に追加されます -->
                </div>
            </div>
        </div>

        <!-- 消費電力情報 - 温度表示の近くに配置 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-bolt"></i> 消費電力情報
            </div>
            <div class="card-body">
                <div id="power-info">
                    <!-- ここに消費電力情報が動的に追加されます -->
                </div>
            </div>
        </div>

        <!-- ディスク情報 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-hdd"></i> ディスク使用率
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-dark table-striped">
                        <thead>
                            <tr>
                                <th>マウントポイント</th>
                                <th>デバイス</th>
                                <th>ファイルシステム</th>
                                <th>合計</th>
                                <th>使用中</th>
                                <th>空き</th>
                                <th>使用率</th>
                            </tr>
                        </thead>
                        <tbody id="disk-info">
                            <!-- ここにディスク情報が動的に追加されます -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ネットワーク情報 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-network-wired"></i> ネットワーク情報
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-dark table-striped">
                        <thead>
                            <tr>
                                <th>インターフェース</th>
                                <th>IPアドレス</th>
                                <th>送信 (MB)</th>
                                <th>受信 (MB)</th>
                            </tr>
                        </thead>
                        <tbody id="network-info">
                            <!-- ここにネットワーク情報が動的に追加されます -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ポート情報 -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-door-open"></i> 使用中のポート情報
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-dark table-striped">
                        <thead>
                            <tr>
                                <th>ポート</th>
                                <th>プロセス名</th>
                                <th>PID</th>
                                <th>ユーザー</th>
                                <th>アドレス</th>
                                <th>アクション</th>
                            </tr>
                        </thead>
                        <tbody id="port-info">
                            <!-- ここにポート情報が動的に追加されます -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CPU履歴データ用の配列
        const cpuHistory = Array(20).fill(0);
        let cpuChart;

        // Chart.jsのデフォルト設定をダークテーマに
        Chart.defaults.color = '#e6edf3';
        Chart.defaults.borderColor = '#30363d';

        // ページロード時に初期化
        $(document).ready(function() {
            // CPUグラフの初期化
            const cpuCtx = document.getElementById('cpu-chart').getContext('2d');
            cpuChart = new Chart(cpuCtx, {
                type: 'line',
                data: {
                    labels: Array(20).fill(''),
                    datasets: [{
                        label: 'CPU使用率 %',
                        data: cpuHistory,
                        borderColor: '#58a6ff',
                        backgroundColor: 'rgba(88, 166, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#e6edf3'
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: '#30363d'
                            },
                            ticks: {
                                color: '#7d8590'
                            }
                        },
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: {
                                color: '#30363d'
                            },
                            ticks: {
                                color: '#7d8590'
                            }
                        }
                    },
                    animation: {
                        duration: 0
                    }
                }
            });

            // 初回データ取得
            fetchAllData();

            // 更新ボタンのクリックイベント
            $('#refresh-btn').click(function() {
                fetchAllData();
            });

            // 定期的な更新（5秒ごと）
            setInterval(fetchAllData, 5000);
        });

        // すべてのデータを取得して表示
        function fetchAllData() {
            $.ajax({
                url: '/api/all',
                type: 'GET',
                dataType: 'json',
                success: function(data) {
                    // 最終更新時刻を更新
                    $('#last-update').text('最終更新: ' + data.timestamp);

                    // システム情報を更新
                    updateSystemInfo(data.system);

                    // CPU情報を更新
                    updateCpuInfo(data.cpu);

                    // メモリ情報を更新
                    updateMemoryInfo(data.memory);

                    // ディスク情報を更新
                    updateDiskInfo(data.disk);

                    // 温度情報を更新
                    updateTemperatureInfo(data.temperature);

                    // GPU情報を更新
                    updateGpuInfo(data.gpu);

                    // ネットワーク情報を更新
                    updateNetworkInfo(data.network);

                    // 消費電力情報を更新
                    updatePowerInfo(data.power);

                    // ポート情報を更新
                    updatePortInfo(data.ports);

                    // アラート情報を更新
                    updateAlerts(data.alerts);
                },
                error: function(xhr, status, error) {
                    console.error('データ取得エラー:', error);
                }
            });
        }

        // システム情報を更新
        function updateSystemInfo(data) {
            const systemInfoHtml = `
                <div class="system-info-item"><strong>ホスト名:</strong><br>${data.hostname}</div>
                <div class="system-info-item"><strong>OS:</strong><br>${data.os} ${data.os_release}</div>
                <div class="system-info-item"><strong>アーキテクチャ:</strong><br>${data.architecture}</div>
                <div class="system-info-item"><strong>起動時間:</strong><br>${data.boot_time}</div>
                <div class="system-info-item"><strong>稼働時間:</strong><br>${data.uptime}</div>
            `;
            $('#system-info').html(systemInfoHtml);
        }

        // CPU情報を更新
        function updateCpuInfo(data) {
            // CPU使用率の更新
            $('#cpu-usage').css('width', data.usage_percent + '%');
            $('#cpu-usage').attr('aria-valuenow', data.usage_percent);
            $('#cpu-usage').text(data.usage_percent + '%');

            // プログレスバーの色を使用率に応じて変更
            const cpuBar = $('#cpu-usage');
            cpuBar.removeClass('bg-success bg-warning bg-danger');
            if (data.usage_percent >= 80) {
                cpuBar.addClass('bg-danger');
            } else if (data.usage_percent >= 60) {
                cpuBar.addClass('bg-warning');
            } else {
                cpuBar.addClass('bg-success');
            }

            // CPU使用率の履歴を更新
            cpuHistory.push(data.usage_percent);
            cpuHistory.shift();
            cpuChart.data.datasets[0].data = cpuHistory;
            cpuChart.update();

            // CPUモデル情報
            $('#cpu-model').html(`<strong>${data.model}</strong>`);

            // CPU詳細情報
            const cpuInfoHtml = `
                <p><strong>物理コア数:</strong> ${data.cores}</p>
                <p><strong>スレッド数:</strong> ${data.threads}</p>
                <p><strong>現在の周波数:</strong> ${data.frequency} MHz</p>
            `;
            $('#cpu-info').html(cpuInfoHtml);
        }

        // メモリ情報を更新
        function updateMemoryInfo(data) {
            // メモリ使用率の更新
            const memBar = $('#memory-usage');
            memBar.css('width', data.percent + '%');
            memBar.attr('aria-valuenow', data.percent);
            memBar.text(data.percent + '%');

            // プログレスバーの色を使用率に応じて変更
            memBar.removeClass('bg-success bg-warning bg-danger');
            if (data.percent >= 90) {
                memBar.addClass('bg-danger');
            } else if (data.percent >= 70) {
                memBar.addClass('bg-warning');
            } else {
                memBar.addClass('bg-success');
            }

            // メモリ詳細情報
            const memoryInfoHtml = `
                <p><strong>合計:</strong> ${data.total} GB</p>
                <p><strong>使用中:</strong> ${data.used} GB</p>
                <p><strong>空き:</strong> ${data.free} GB</p>
            `;
            $('#memory-info').html(memoryInfoHtml);

            // スワップ使用率の更新
            $('#swap-usage').css('width', data.swap_percent + '%');
            $('#swap-usage').attr('aria-valuenow', data.swap_percent);
            $('#swap-usage').text(data.swap_percent + '%');

            // スワップ詳細情報
            const swapInfoHtml = `
                <p><strong>合計:</strong> ${data.swap_total} GB</p>
                <p><strong>使用中:</strong> ${data.swap_used} GB</p>
                <p><strong>空き:</strong> ${data.swap_free} GB</p>
            `;
            $('#swap-info').html(swapInfoHtml);
        }

        // ディスク情報を更新
        function updateDiskInfo(data) {
            let diskInfoHtml = '';

            data.forEach(function(disk) {
                diskInfoHtml += `
                    <tr>
                        <td>${disk.mountpoint}</td>
                        <td>${disk.device}</td>
                        <td>${disk.fstype}</td>
                        <td>${disk.total} GB</td>
                        <td>${disk.used} GB</td>
                        <td>${disk.free} GB</td>
                        <td>
                            <div class="progress" style="height: 20px;">
                                <div class="progress-bar ${getDiskProgressBarClass(disk.percent)}" role="progressbar" style="width: ${disk.percent}%;" aria-valuenow="${disk.percent}" aria-valuemin="0" aria-valuemax="100">${disk.percent}%</div>
                            </div>
                        </td>
                    </tr>
                `;
            });

            $('#disk-info').html(diskInfoHtml);
        }

        // ディスク使用率に応じてプログレスバーの色を変更
        function getDiskProgressBarClass(percent) {
            if (percent >= 90) {
                return 'bg-danger';
            } else if (percent >= 70) {
                return 'bg-warning';
            } else {
                return 'bg-success';
            }
        }

        // 温度情報を更新 - 横長レイアウト用
        function updateTemperatureInfo(data) {
            let tempInfoHtml = '';

            if (data.error) {
                tempInfoHtml = `<p class="text-warning">注意: ${data.error}</p>`;
            } else {
                tempInfoHtml += '<div class="temperature-grid">';

                // CPU温度
                if (data.cpu) {
                    for (const [key, value] of Object.entries(data.cpu)) {
                        tempInfoHtml += `
                            <div class="temp-item">
                                <div class="temp-label">CPU ${key}</div>
                                <div class="temp-value ${getTemperatureClass(value)}">${value}°C</div>
                                <div class="temp-bar">
                                    <div class="temp-fill ${getTemperatureBarClass(value)}" style="width: ${Math.min(value * 100 / 100, 100)}%;"></div>
                                </div>
                            </div>
                        `;
                    }
                }

                // GPU温度（特別なスタイルで表示）
                if (data.gpu) {
                    for (const [key, value] of Object.entries(data.gpu)) {
                        tempInfoHtml += `
                            <div class="temp-item gpu-temp">
                                <div class="temp-label"><i class="fas fa-tv"></i> ${key}</div>
                                <div class="temp-value ${getGPUTemperatureClass(value)}">${value}°C</div>
                                <div class="temp-bar">
                                    <div class="temp-fill" style="width: ${Math.min(value * 100 / 100, 100)}%;"></div>
                                </div>
                            </div>
                        `;
                    }
                }

                // NVMe温度
                if (data.nvme) {
                    for (const [key, value] of Object.entries(data.nvme)) {
                        tempInfoHtml += `
                            <div class="temp-item">
                                <div class="temp-label">NVMe ${key}</div>
                                <div class="temp-value ${getTemperatureClass(value)}">${value}°C</div>
                                <div class="temp-bar">
                                    <div class="temp-fill ${getTemperatureBarClass(value)}" style="width: ${Math.min(value * 100 / 100, 100)}%;"></div>
                                </div>
                            </div>
                        `;
                    }
                }

                tempInfoHtml += '</div>';
            }

            $('#temperature-info').html(tempInfoHtml || '<p>温度情報は利用できません</p>');
        }

        // 温度に応じてテキスト色を変更
        function getTemperatureClass(value) {
            if (value >= 80) {
                return 'text-danger fw-bold';
            } else if (value >= 70) {
                return 'text-warning fw-bold';
            } else if (value >= 60) {
                return 'text-info';
            } else {
                return 'text-success';
            }
        }

        // GPU温度用の特別な色分け
        function getGPUTemperatureClass(value) {
            if (value >= 85) {
                return 'text-danger fw-bold';
            } else if (value >= 75) {
                return 'text-warning fw-bold';
            } else {
                return 'fw-bold';
            }
        }

        // 温度に応じてプログレスバーの色を変更
        function getTemperatureBarClass(value) {
            if (value >= 80) {
                return 'bg-danger';
            } else if (value >= 70) {
                return 'bg-warning';
            } else if (value >= 60) {
                return 'bg-info';
            } else {
                return 'bg-success';
            }
        }

        // GPU情報を更新（詳細版）
        function updateGpuInfo(data) {
            let gpuInfoHtml = '';

            if (data.error) {
                gpuInfoHtml = `<p class="text-danger">エラー: ${data.error}</p>`;
            } else if (!data.available) {
                gpuInfoHtml = `<div class="no-gpu-message"><i class="fas fa-info-circle"></i> ${data.message || 'GPUが検出されませんでした'}</div>`;
            } else if (data.gpus && data.gpus.length > 0) {
                // NVIDIA GPUの詳細情報を表示
                data.gpus.forEach(function(gpu) {
                    gpuInfoHtml += `
                        <div class="mb-3">
                            <h6><strong>${gpu.name}</strong></h6>
                            <p class="mb-2"><strong>ドライバ:</strong> ${data.driver}</p>
                            
                            <div class="gpu-stats">
                                <div class="gpu-stat-item">
                                    <div class="gpu-stat-value">${gpu.utilization}%</div>
                                    <div class="gpu-stat-label">GPU使用率</div>
                                </div>
                                <div class="gpu-stat-item">
                                    <div class="gpu-stat-value">${gpu.fan_speed}%</div>
                                    <div class="gpu-stat-label">ファン速度</div>
                                </div>
                                <div class="gpu-stat-item">
                                    <div class="gpu-stat-value">${Math.round(gpu.power_draw)}W</div>
                                    <div class="gpu-stat-label">電力 (${Math.round(gpu.power_limit)}W)</div>
                                </div>
                            </div>
                            
                            <div class="mt-3">
                                <h6>メモリ使用率</h6>
                                <div class="progress">
                                    <div class="progress-bar bg-gpu" role="progressbar" 
                                         style="width: ${gpu.memory_percent}%;" 
                                         aria-valuenow="${gpu.memory_percent}" 
                                         aria-valuemin="0" aria-valuemax="100">
                                        ${Math.round(gpu.memory_used)}MB / ${Math.round(gpu.memory_total)}MB (${gpu.memory_percent}%)
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                // 基本的なGPU情報のみ表示
                gpuInfoHtml = `
                    <p><strong>デバイス:</strong> ${data.device}</p>
                    <p><strong>ドライバ:</strong> ${data.driver}</p>
                    <p class="text-muted"><small>nvidia-smiが利用できないため、詳細情報は表示できません</small></p>
                `;
            }

            $('#gpu-info').html(gpuInfoHtml);
        }

        // ネットワーク情報を更新
        function updateNetworkInfo(data) {
            let networkInfoHtml = '';

            if (data.error) {
                networkInfoHtml = `<tr><td colspan="4" class="text-danger">エラー: ${data.error}</td></tr>`;
            } else {
                for (const [nic, info] of Object.entries(data)) {
                    // IPv4アドレスを取得
                    let ipAddress = 'なし';
                    if (info.addresses && info.addresses.length > 0) {
                        for (const addr of info.addresses) {
                            if (addr.type === 'AF_INET') {
                                ipAddress = addr.address;
                                break;
                            }
                        }
                    }

                    networkInfoHtml += `
                        <tr>
                            <td>${nic}</td>
                            <td>${ipAddress}</td>
                            <td>${info.sent}</td>
                            <td>${info.received}</td>
                        </tr>
                    `;
                }
            }

            $('#network-info').html(networkInfoHtml);
        }

        // 消費電力情報を更新
        function updatePowerInfo(data) {
            let powerInfoHtml = '';

            if (data.error) {
                powerInfoHtml = `<p class="text-danger">エラー: ${data.error}</p>`;
            } else {
                powerInfoHtml += '<div class="power-grid">';

                // 合計電力
                if (data.total_power !== null) {
                    powerInfoHtml += `
                        <div class="power-item">
                            <div class="power-label">合計消費電力</div>
                            <div class="power-value">${Math.round(data.total_power)}W</div>
                            <div class="power-bar">
                                <div class="power-fill" style="width: 100%;"></div>
                            </div>
                        </div>
                    `;
                }

                // NVIDIA GPU電力
                if (data.gpu_power && data.gpu_power.length > 0) {
                    data.gpu_power.forEach(function(gpu, index) {
                        const powerPercent = gpu.limit > 0 ? (gpu.current / gpu.limit * 100) : 100;
                        powerInfoHtml += `
                            <div class="power-item">
                                <div class="power-label"><i class="fas fa-tv"></i> ${gpu.name}</div>
                                <div class="power-value">${Math.round(gpu.current)}W / ${Math.round(gpu.limit)}W</div>
                                <div class="power-bar">
                                    <div class="power-fill" style="width: ${powerPercent}%;"></div>
                                </div>
                                <small class="text-muted">${Math.round(gpu.percent)}%</small>
                            </div>
                        `;
                    });
                }

                // AMD GPU電力
                if (data.amd_gpu) {
                    powerInfoHtml += `
                        <div class="power-item">
                            <div class="power-label"><i class="fas fa-tv"></i> ${data.amd_gpu.name}</div>
                            <div class="power-value">${data.amd_gpu.current}W</div>
                            <div class="power-bar">
                                <div class="power-fill" style="width: 50%;"></div>
                            </div>
                        </div>
                    `;
                }

                powerInfoHtml += '</div>';

                if (!data.total_power && (!data.gpu_power || data.gpu_power.length === 0) && !data.amd_gpu) {
                    powerInfoHtml = '<p class="text-muted">消費電力情報は利用できません（GPUが検出されないか、電力監視未対応です）</p>';
                }
            }

            $('#power-info').html(powerInfoHtml);
        }

        // ポート情報を更新
        function updatePortInfo(data) {
            let portInfoHtml = '';

            if (data.error) {
                portInfoHtml = `<tr><td colspan="6" class="text-danger">エラー: ${data.error}</td></tr>`;
            } else if (data.length === 0) {
                portInfoHtml = '<tr><td colspan="6" class="text-muted">使用中のポートがありません</td></tr>';
            } else {
                data.forEach(function(port) {
                    const killButton = port.pid ?
                        `<button class="btn btn-danger btn-sm" onclick="killPort(${port.port})">
                            <i class="fas fa-times"></i> Kill
                        </button>` :
                        '<span class="text-muted">N/A</span>';

                    portInfoHtml += `
                        <tr>
                            <td><strong>${port.port}</strong></td>
                            <td>${port.process}</td>
                            <td>${port.pid || 'N/A'}</td>
                            <td>${port.user}</td>
                            <td>${port.address}</td>
                            <td>${killButton}</td>
                        </tr>
                    `;
                });
            }

            $('#port-info').html(portInfoHtml);
        }

        // アラート情報を更新
        function updateAlerts(alerts) {
            let alertsHtml = '';

            if (alerts && alerts.length > 0) {
                alerts.forEach(function(alert) {
                    const alertClass = alert.level === 'danger' ? 'alert-danger' : 'alert-warning';
                    const icon = alert.level === 'danger' ? 'fa-exclamation-triangle' : 'fa-exclamation-circle';

                    alertsHtml += `
                        <div class="alert-banner ${alertClass}">
                            <i class="fas ${icon}"></i> <strong>${alert.type}:</strong> ${alert.message}
                        </div>
                    `;
                });
            }

            $('#alerts-container').html(alertsHtml);
        }

        // ポートをキル
        function killPort(port) {
            if (!confirm(`ポート ${port} を使用しているプロセスを終了しますか？`)) {
                return;
            }

            $.ajax({
                url: `/api/kill_port/${port}`,
                type: 'POST',
                success: function(response) {
                    if (response.success) {
                        alert(response.message);
                        fetchAllData();  // データを再取得
                    } else {
                        alert('エラー: ' + response.message);
                    }
                },
                error: function(xhr, status, error) {
                    alert('エラーが発生しました: ' + error);
                }
            });
        }

        // プロセスをキル
        function killProcess(pid) {
            if (!confirm(`PID ${pid} のプロセスを終了しますか？`)) {
                return;
            }

            $.ajax({
                url: `/api/kill_process/${pid}`,
                type: 'POST',
                success: function(response) {
                    if (response.success) {
                        alert(response.message);
                        fetchAllData();  // データを再取得
                    } else {
                        alert('エラー: ' + response.message);
                    }
                },
                error: function(xhr, status, error) {
                    alert('エラーが発生しました: ' + error);
                }
            });
        }
    </script>
</body>
</html>
